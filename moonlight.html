<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>月华 · Moonlight Landing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --midnight: #1a1a3e;
      --silver: #c0c0c0;
      --moonlight: #f0f0ff;
      --lavender: #b7a9e0;
      --deep-purple: #2a2a5a;
      --silver-white: #e8e8f8;
      --glass-bg: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(192, 192, 192, 0.4);
      --shadow-moon: rgba(240, 240, 255, 0.3);
      --text-primary: var(--moonlight);
      --text-secondary: var(--silver);
      --card-bg: rgba(26, 26, 62, 0.6);
      --gradient-hero: linear-gradient(180deg, #1a1a3e 0%, #2a2a5a 35%, #8a7ac0 65%, #c0c0c0 85%, #f0f0ff 100%);
      --gradient-cta: linear-gradient(135deg, #b0b0d0 0%, #e0e0ff 50%, #c0c0e0 100%);
      --btn-text: #1a1a3e;
      --footer-bg: #0f0f2a;
      --moon-glow: rgba(240, 240, 255, 0.5);
    }

    [data-theme="dark"] {
      --midnight: #1a1a3e;
      --silver: #c0c0c0;
      --moonlight: #f0f0ff;
      --text-primary: var(--moonlight);
      --text-secondary: var(--silver);
      --card-bg: rgba(26, 26, 62, 0.6);
      --gradient-hero: linear-gradient(180deg, #1a1a3e 0%, #2a2a5a 35%, #8a7ac0 65%, #c0c0c0 85%, #f0f0ff 100%);
      --footer-bg: #0f0f2a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
    word-break: break-word;
    overflow-wrap: break-word;
      font-family: 'Noto Sans SC', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-weight: 200;
      background: var(--midnight);
      color: var(--text-primary);
      line-height: 1.7;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 0.4s ease, color 0.3s ease;
    }

    .theme-toggle {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 1000;
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-glow);
      border-radius: 50%;
      width: 3rem;
      height: 3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 20px rgba(192, 192, 192, 0.15);
    }

    .theme-toggle:hover {
      transform: scale(1.1) rotate(15deg);
      box-shadow: 0 6px 30px var(--shadow-moon);
    }

    .theme-toggle svg {
      width: 1.4rem;
      height: 1.4rem;
      fill: var(--text-primary);
      transition: transform 0.4s ease, fill 0.3s ease;
    }

    #starCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 10;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Hero Section */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      padding: 6rem 1rem 4rem;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle at 35% 35%, #f8f8ff 0%, #e0d8f8 30%, var(--lavender) 60%, transparent 75%);
      border-radius: 50%;
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      animation: moonPulse 6s ease-in-out infinite alternate;
      z-index: 0;
    }

    .hero::after {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(240, 240, 255, 0.12) 0%, rgba(183, 169, 224, 0.08) 40%, transparent 70%);
      border-radius: 50%;
      top: -2%;
      left: 50%;
      transform: translateX(-50%);
      animation: moonPulse 8s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes moonPulse {
      0% {
        box-shadow: 0 0 80px rgba(240, 240, 255, 0.4), 0 0 160px rgba(183, 169, 224, 0.3), 0 0 240px rgba(192, 192, 192, 0.15);
        transform: translateX(-50%) scale(0.97);
      }
      100% {
        box-shadow: 0 0 120px rgba(240, 240, 255, 0.6), 0 0 240px rgba(183, 169, 224, 0.4), 0 0 360px rgba(192, 192, 192, 0.2);
        transform: translateX(-50%) scale(1.04);
      }
    }

    .hero-content {
      position: relative;
      z-index: 5;
    }

    .hero h1 {
      font-size: clamp(4rem, 14vw, 8rem);
      font-weight: 200;
      letter-spacing: 0.3em;
      text-shadow: 0 0 40px rgba(240, 240, 255, 0.5), 0 0 80px rgba(183, 169, 224, 0.3);
      color: var(--moonlight);
      margin-bottom: 1rem;
    }

    .hero-subtitle {
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 0.5em;
      color: var(--silver);
      display: inline-block;
      padding: 0.5rem 2.5rem;
      border: 1px solid var(--border-glow);
      border-radius: 50px;
      background: var(--glass-bg);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .hero-desc {
      max-width: 550px;
      margin: 2.5rem auto 0;
      font-weight: 200;
      color: var(--text-secondary);
      font-size: 1.05rem;
      line-height: 1.9;
    }

    .star-dots {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .star-dots span {
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
      animation: twinkle 3s ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.15; transform: scale(0.7); }
      50% { opacity: 0.9; transform: scale(1.3); }
      100% { opacity: 0.2; transform: scale(0.8); }
    }

    /* Features Section */
    .section-title {
      text-align: center;
      font-size: 2.2rem;
      font-weight: 200;
      letter-spacing: 0.15em;
      color: var(--text-primary);
      margin-bottom: 3rem;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      margin: 4rem 0;
    }

    .feature-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border-glow);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      text-align: center;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      opacity: 0;
      transform: translateY(30px);
    }

    .feature-card.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    .feature-card:hover {
      border-color: var(--silver);
      box-shadow: 0 12px 48px rgba(192, 192, 192, 0.15), 0 0 60px var(--shadow-moon);
      transform: translateY(-6px);
    }

    .crescent-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.5rem;
      display: block;
      filter: drop-shadow(0 0 16px rgba(183, 169, 224, 0.5));
    }

    .crescent-icon svg {
      width: 100%;
      height: 100%;
    }

    .feature-card h3 {
      font-weight: 300;
      font-size: 1.5rem;
      letter-spacing: 0.12em;
      margin-bottom: 0.8rem;
      color: var(--text-primary);
    }

    .feature-card p {
      font-weight: 200;
      color: var(--text-secondary);
      line-height: 1.8;
    }

    /* Stats Section */
    .stats-section {
      display: flex;
      justify-content: center;
      gap: 4rem;
      margin: 5rem 0;
      padding: 3rem 0;
      border-top: 1px solid var(--border-glow);
      border-bottom: 1px solid var(--border-glow);
      flex-wrap: wrap;
    }

    .stat-item {
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .stat-item.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    .stat-number {
      font-size: 3rem;
      font-weight: 200;
      color: var(--moonlight);
      text-shadow: 0 0 30px var(--shadow-moon);
      line-height: 1.2;
    }

    .stat-label {
      font-weight: 300;
      letter-spacing: 0.25em;
      color: var(--text-secondary);
      font-size: 0.9rem;
      margin-top: 0.3rem;
    }

    /* Testimonial */
    .testimonial {
      max-width: 680px;
      margin: 4rem auto;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 2.5rem 3rem;
      border-radius: 2rem;
      border: 1px solid var(--border-glow);
      text-align: center;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.15);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .testimonial.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    .testimonial p {
      font-size: 1.15rem;
      font-weight: 200;
      color: var(--text-secondary);
      font-style: italic;
      line-height: 1.9;
    }

    .testimonial cite {
      display: block;
      margin-top: 1.2rem;
      font-weight: 300;
      color: var(--silver);
      font-style: normal;
      letter-spacing: 0.1em;
    }

    /* CTA Section */
    .cta-section {
      text-align: center;
      margin: 5rem 0 4rem;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .cta-section.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    .cta-button {
      display: inline-block;
      background: var(--gradient-cta);
      color: var(--btn-text);
      font-weight: 400;
      letter-spacing: 0.25em;
      padding: 1.3rem 4rem;
      border-radius: 60px;
      border: none;
      font-size: 1.25rem;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 40px rgba(192, 192, 192, 0.25), 0 0 80px rgba(183, 169, 224, 0.1);
      position: relative;
      overflow: hidden;
    }

    .cta-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      transition: left 0.5s ease;
    }

    .cta-button:hover::before {
      left: 100%;
    }

    .cta-button:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 8px 60px rgba(192, 192, 192, 0.35), 0 0 100px rgba(183, 169, 224, 0.15);
    }

    /* Footer */
    footer {
      background: var(--footer-bg);
      border-radius: 2rem 2rem 0 0;
      padding: 3rem 2rem 2rem;
      text-align: center;
      border-top: 1px solid var(--border-glow);
      margin-top: 3rem;
    }

    footer p {
      font-weight: 200;
      color: var(--text-secondary);
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      opacity: 0.7;
    }

    /* Reveal utility */
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1), transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .reveal.revealed {
      opacity: 1;
      transform: translateY(0);
    }

    /* Responsive */
    @media (max-width: 768px) {
      .hero {
        min-height: 85vh;
        padding: 5rem 1rem 3rem;
      }

      .hero h1 {
        letter-spacing: 0.15em;
      }

      .hero-subtitle {
        font-size: 0.9rem;
        letter-spacing: 0.3em;
        padding: 0.4rem 1.5rem;
      }

      .features-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
        margin: 3rem 0;
      }

      .stats-section {
        gap: 2rem;
        margin: 3rem 0;
      }

      .stat-number {
        font-size: 2.2rem;
      }

      .cta-button {
        padding: 1rem 2.5rem;
        font-size: 1rem;
      }

      .testimonial {
        padding: 2rem 1.5rem;
        margin: 3rem 0;
      }
    }

    @media (max-width: 480px) {
      .hero h1 {
        font-size: clamp(3rem, 12vw, 5rem);
      }

      .features-grid {
        gap: 1.2rem;
      }

      .feature-card {
        padding: 2rem 1.5rem;
      }

      .stats-section {
        flex-direction: column;
        gap: 1.5rem;
      }

      .theme-toggle {
        top: 1rem;
        right: 1rem;
        width: 2.5rem;
        height: 2.5rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="starCanvas"></canvas>

  <div class="theme-toggle" id="themeToggle" aria-label="切换主题">
    <svg viewBox="0 0 24 24" class="sun-icon">
      <circle cx="12" cy="12" r="5" />
      <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="12" y1="1" x2="12" y2="4" />
        <line x1="12" y1="20" x2="12" y2="23" />
        <line x1="4.22" y1="4.22" x2="6.34" y2="6.34" />
        <line x1="17.66" y1="17.66" x2="19.78" y2="19.78" />
        <line x1="1" y1="12" x2="4" y2="12" />
        <line x1="20" y1="12" x2="23" y2="12" />
        <line x1="4.22" y1="19.78" x2="6.34" y2="17.66" />
        <line x1="17.66" y1="6.34" x2="19.78" y2="4.22" />
      </g>
    </svg>
    <svg viewBox="0 0 24 24" class="moon-icon" style="display:none;">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </div>

  <main class="container">
    <section class="hero" id="hero">
      <div class="star-dots" id="heroStars"></div>
      <div class="hero-content">
        <h1>月华</h1>
        <div class="hero-subtitle">月光银 · 静谧之夜</div>
        <p class="hero-desc">深蓝紫渐变至银白，如月华流泻。优雅细体、新月微光，沉浸于银色星河的静谧世界。</p>
      </div>
    </section>

    <div class="features-grid" id="featuresGrid">
      <div class="feature-card reveal">
        <div class="crescent-icon">
          <svg viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="18" stroke="var(--lavender)" stroke-width="1.5" fill="none"/>
            <path d="M24 6a18 18 0 0 1 0 36" fill="var(--lavender)" fill-opacity="0.25"/>
            <circle cx="20" cy="24" r="8" fill="var(--moonlight)" fill-opacity="0.15"/>
          </svg>
        </div>
        <h3>银月轮廓</h3>
        <p>新月微光，银色边框与柔和辉光交织。细体字重现月光的优雅弧线。</p>
      </div>
      <div class="feature-card reveal">
        <div class="crescent-icon">
          <svg viewBox="0 0 48 48" fill="none">
            <path d="M14 14l4-4m0 0l4-4m-4 4l-4-4m4 4l-4 4" stroke="var(--silver)" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M34 14l4-4m0 0l4-4m-4 4l-4-4m4 4l-4 4" stroke="var(--silver)" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
            <path d="M24 34l4-4m0 0l4-4m-4 4l-4-4m4 4l-4 4" stroke="var(--lavender)" stroke-width="1.2" stroke-linecap="round"/>
            <circle cx="24" cy="24" r="3" fill="var(--moonlight)" fill-opacity="0.4"/>
          </svg>
        </div>
        <h3>星河闪烁</h3>
        <p>滚动触发星芒闪烁，画布粒子随目光流动，沉浸感十足。</p>
      </div>
      <div class="feature-card reveal">
        <div class="crescent-icon">
          <svg viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="14" stroke="var(--lavender)" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/>
            <circle cx="24" cy="24" r="8" fill="var(--lavender)" fill-opacity="0.15"/>
            <path d="M18 24a6 6 0 0 1 12 0" stroke="var(--moonlight)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
          </svg>
        </div>
        <h3>薰衣草紫</h3>
        <p>淡紫与银白交织，月光辉映，卡片悬浮于夜色之中。</p>
      </div>
    </div>

    <div class="stats-section" id="statsSection">
      <div class="stat-item reveal">
        <div class="stat-number">128+</div>
        <div class="stat-label">月夜组件</div>
      </div>
      <div class="stat-item reveal">
        <div class="stat-number">99%</div>
        <div class="stat-label">银辉覆盖</div>
      </div>
      <div class="stat-item reveal">
        <div class="stat-number">4.9</div>
        <div class="stat-label">星河评价</div>
      </div>
    </div>

    <div class="testimonial reveal">
      <p>"月华主题让整个页面沉浸在银色月光中，细体字与新月图标完美呼应，每次滚动都像拨动星光。"</p>
      <cite>—— 设计总监 · 陈银</cite>
    </div>

    <div class="cta-section reveal">
      <a href="#" class="cta-button">步入月光 · 立即体验</a>
    </div>
  </main>

  <footer>
    <p>© 月华 · 月光银着陆页 · 深蓝至银白渐变 | 新月微光</p>
  </footer>

  <script>
    (function() {
      /* ---- Star Canvas ---- */
      var canvas = document.getElementById('starCanvas');
      var ctx = canvas.getContext('2d');
      var stars = [];
      var W, H;
      var dpr = window.devicePixelRatio || 1;

      function resize() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        initStars();
      }

      function initStars() {
        stars = [];
        var count = Math.min(180, Math.floor(W * H / 8000));
        for (var i = 0; i < count; i++) {
          stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            r: Math.random() * 2 + 0.5,
            alpha: Math.random() * 0.7 + 0.3,
            speed: Math.random() * 0.008 + 0.002,
            phase: Math.random() * Math.PI * 2
          });
        }
      }

      function draw(t) {
        ctx.clearRect(0, 0, W, H);
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        var rgb = isDark ? '220,220,255' : '60,50,100';
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          var flicker = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
          var a = s.alpha * flicker;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(' + rgb + ',' + a + ')';
          if (s.r > 1.4) {
            ctx.shadowBlur = 12;
            ctx.shadowColor = 'rgba(200,200,255,' + (a * 0.4) + ')';
          } else {
            ctx.shadowBlur = 0;
          }
          ctx.fill();
        }
        ctx.shadowBlur = 0;
        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(draw);

      /* ---- Hero Stars ---- */
      var heroEl = document.getElementById('heroStars');
      for (var i = 0; i < 25; i++) {
        var sp = document.createElement('span');
        var sz = Math.random() * 4 + 2;
        sp.style.width = sz + 'px';
        sp.style.height = sz + 'px';
        sp.style.left = Math.random() * 100 + '%';
        sp.style.top = Math.random() * 100 + '%';
        sp.style.animationDuration = (Math.random() * 3 + 2) + 's';
        sp.style.animationDelay = (Math.random() * 4) + 's';
        sp.style.boxShadow = '0 0 ' + (sz + 4) + 'px rgba(240,240,255,0.6)';
        heroEl.appendChild(sp);
      }

      /* ---- Theme Toggle ---- */
      var toggle = document.getElementById('themeToggle');
      var sunIcon = toggle.querySelector('.sun-icon');
      var moonIcon = toggle.querySelector('.moon-icon');

      function updateIcons() {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        sunIcon.style.display = isDark ? 'none' : 'block';
        moonIcon.style.display = isDark ? 'block' : 'none';
      }

      toggle.addEventListener('click', function() {
        var current = document.documentElement.getAttribute('data-theme');
        var next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        updateIcons();
      });

      updateIcons();

      /* ---- Scroll Reveal ---- */
      var revealEls = document.querySelectorAll('.feature-card, .stat-item, .testimonial, .cta-section');

      function checkReveal() {
        for (var i = 0; i < revealEls.length; i++) {
          var el = revealEls[i];
          var rect = el.getBoundingClientRect();
          if (rect.top < window.innerHeight - 60) {
            el.classList.add('revealed');
          }
        }
      }

      var observer = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('revealed');
          }
        });
      }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });

      revealEls.forEach(function(el) { observer.observe(el); });

      /* ---- Scroll-triggered star twinkle boost ---- */
      var scrollBoost = 0;
      var lastScroll = 0;

      window.addEventListener('scroll', function() {
        var st = window.pageYOffset || document.documentElement.scrollTop;
        var delta = Math.abs(st - lastScroll);
        scrollBoost = Math.min(delta * 0.05, 1);
        lastScroll = st;
      }, { passive: true });

      /* boost star alpha on scroll */
      var origDraw = draw;
      function drawWithBoost(t) {
        ctx.clearRect(0, 0, W, H);
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        var rgb = isDark ? '220,220,255' : '60,50,100';
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          var flicker = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
          var a = Math.min(1, s.alpha * flicker + scrollBoost * 0.3);
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r * (1 + scrollBoost * 0.15), 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(' + rgb + ',' + a + ')';
          if (s.r > 1.4) {
            ctx.shadowBlur = 14 + scrollBoost * 10;
            ctx.shadowColor = 'rgba(200,200,255,' + (a * 0.5) + ')';
          } else {
            ctx.shadowBlur = 0;
          }
          ctx.fill();
        }
        ctx.shadowBlur = 0;
        scrollBoost *= 0.92;
        requestAnimationFrame(drawWithBoost);
      }

      cancelAnimationFrame(draw);
      requestAnimationFrame(drawWithBoost);

      /* ---- Stagger reveal delay ---- */
      setTimeout(function() {
        checkReveal();
      }, 100);
    })();
  </script>
</body>
</html>
