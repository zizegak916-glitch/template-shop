<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3ec">
  <meta name="description" content="墨序——一页如水墨动画般展开的数字叙事。">
  <title>墨序 · 水墨动画式数字叙事</title>
  <style>
    :root {
      --paper: #f7f3ec;
      --dense: #121010;
      --heavy: #2a2525;
      --medium: #5c5555;
      --light: #9e9595;
      --faint: #d4cfca;
      --seal: #c41e3a;
      --serif: STKaiti, "FZQingKeBenYueSongS-R-GB", "Noto Serif SC", "Songti SC", SimSun, serif;
      --ease-ink: cubic-bezier(.16, .76, .3, 1);
      --gutter: clamp(1.4rem, 5vw, 6rem);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--paper); }
    body {
      margin: 0;
      overflow-x: hidden;
      color: var(--heavy);
      background: var(--paper);
      font-family: var(--serif);
      line-height: 2.05;
      letter-spacing: .06em;
      -webkit-font-smoothing: antialiased;
    }
    body::after {
      position: fixed;
      inset: 0;
      z-index: 1000;
      pointer-events: none;
      content: "";
      opacity: .16;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg width='180' height='180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='4' seed='19'/%3E%3CfeColorMatrix values='.45 0 0 0 .18 .35 0 0 0 .15 .28 0 0 0 .12 0 0 0 .16 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
    }
    ::selection { color: var(--paper); background: var(--heavy); }
    a { color: inherit; text-decoration: none; }
    svg { display: block; }
    button, a { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 1px solid var(--heavy); outline-offset: 5px; }

    .skip-link {
      position: fixed; top: 1rem; left: 1rem; z-index: 1100;
      padding: .4rem 1rem; color: var(--paper); background: var(--heavy);
      transform: translateY(-180%); transition: transform .2s;
    }
    .skip-link:focus { transform: none; }

    .site-nav {
      position: absolute; inset: 0 0 auto; z-index: 20;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.5rem var(--gutter); font-size: .8rem; letter-spacing: .24em;
    }
    .brand { font-weight: 700; font-size: 1rem; color: var(--dense); }
    .nav-links { display: flex; gap: clamp(1rem, 3vw, 2.8rem); margin: 0; padding: 0; list-style: none; }
    .nav-links a { position: relative; padding-block: .25rem; }
    .nav-links a::after {
      position: absolute; right: 3%; bottom: 0; left: 0; height: 1px;
      content: ""; background: var(--medium); transform: scaleX(0) rotate(-1deg);
      transform-origin: right; transition: transform .55s var(--ease-ink);
    }
    .nav-links a:hover::after { transform: scaleX(1) rotate(-1deg); transform-origin: left; }

    .hero { position: relative; min-height: 100svh; overflow: hidden; isolation: isolate; }
    .hero-copy {
      position: absolute; top: 20%; left: clamp(8%, 10vw, 13%); z-index: 4;
      display: flex; align-items: flex-start; gap: 2.1rem;
    }
    .hero h1 {
      margin: 0; color: var(--dense); font-size: clamp(3.3rem, 7vw, 7.4rem);
      line-height: 1.02; letter-spacing: .12em; writing-mode: vertical-rl;
      font-weight: 800;
    }
    .hero-kicker {
      margin: 4.7rem 0 0; color: var(--medium); font-size: .78rem;
      letter-spacing: .3em; writing-mode: vertical-rl;
    }
    .hero-landscape {
      position: absolute; right: -4vw; bottom: -2%; z-index: 1;
      width: min(78vw, 1180px); height: 82%; overflow: visible;
      will-change: clip-path, opacity, transform;
      clip-path: polygon(47% 50%, 52% 48%, 55% 52%, 50% 55%);
      opacity: 0;
      transform: translate3d(1.5%, 2%, 0) scale(.98);
      animation: mountain-bleed 2.8s .15s var(--ease-ink) forwards;
    }
    @keyframes mountain-bleed {
      0% { opacity: .08; clip-path: polygon(49% 51%, 52% 48%, 54% 52%, 51% 55%); transform: translate3d(1.5%, 2%, 0) scale(.96); filter: blur(5px); }
      42% { opacity: .7; clip-path: polygon(25% 42%, 49% 5%, 69% 20%, 98% 63%, 90% 99%, 34% 94%, 3% 72%); }
      100% { opacity: 1; clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); transform: translate3d(0, 0, 0) scale(1); filter: blur(0); }
    }
    .hero-caption {
      position: absolute; right: var(--gutter); bottom: 2.2rem; z-index: 5;
      color: var(--medium); font-size: .67rem; letter-spacing: .22em;
    }
    .scroll-mark {
      position: absolute; bottom: 2rem; left: var(--gutter); z-index: 4;
      display: flex; align-items: center; gap: .8rem; color: var(--light);
      font-size: .65rem; letter-spacing: .24em; writing-mode: vertical-rl;
    }
    .scroll-mark::before { width: 1px; height: 3rem; content: ""; background: var(--faint); transform: rotate(1deg); }

    .divider { position: relative; height: clamp(90px, 13vw, 170px); overflow: hidden; }
    .divider svg { width: 100%; height: 100%; overflow: visible; }
    .brush-path {
      fill: none; stroke: var(--heavy); stroke-linecap: round; opacity: .76;
      stroke-dasharray: 1300; stroke-dashoffset: 1300;
      filter: url(#brush-bleed); transition: stroke-dashoffset 1.8s var(--ease-ink);
    }
    .divider.visible .brush-path { stroke-dashoffset: 0; }

    .section { position: relative; padding-inline: var(--gutter); }
    .section-label { margin: 0; color: var(--light); font-size: .68rem; letter-spacing: .28em; text-transform: uppercase; }
    .section-title { margin: .3rem 0 0; color: var(--dense); font-size: clamp(2.4rem, 5vw, 5.2rem); line-height: 1.2; letter-spacing: .12em; }

    .bold-section { min-height: 115vh; padding-top: 6vh; padding-bottom: 8vh; }
    .bold-heading { margin-left: 5vw; }
    .cards { position: relative; max-width: 1160px; min-height: 760px; margin: 1.5rem auto 0; }
    .ink-card {
      position: absolute; width: min(48%, 520px); padding: clamp(1rem, 2vw, 1.6rem);
      isolation: isolate; background: rgba(247, 243, 236, .58); cursor: default;
      filter: url(#card-edge); transform: translate3d(0, 0, 0); will-change: transform;
      transition: transform .7s var(--ease-ink);
    }
    .ink-card::before {
      position: absolute; inset: 0; z-index: -1; content: "";
      background: var(--faint); opacity: .38;
      clip-path: polygon(1% 3%, 99% 1%, 98% 96%, 81% 99%, 4% 97%, 0 72%);
    }
    .ink-card:hover { transform: translate3d(0, -7px, 0) rotate(.2deg); }
    .card-one { top: 10%; left: 2%; transform: rotate(-.8deg); }
    .card-two { top: 36%; right: 0; transform: rotate(.55deg); }
    .card-art { width: 100%; aspect-ratio: 16 / 9; overflow: hidden; background: var(--faint); }
    .card-art svg { width: 100%; height: 100%; filter: grayscale(1) contrast(1.2) sepia(.1); }
    .card-copy { display: grid; grid-template-columns: auto 1fr; gap: 1.2rem; padding: 1.25rem .4rem .4rem; }
    .card-number { color: var(--light); font-size: .75rem; }
    .ink-card h3 { margin: 0 0 .4rem; color: var(--dense); font-size: 1.3rem; letter-spacing: .13em; }
    .ink-card p { max-width: 33em; margin: 0; color: var(--medium); font-size: .82rem; line-height: 2; }
    .splatter { position: absolute; z-index: 4; width: var(--s); height: var(--s); pointer-events: none; border-radius: 47% 53% 38% 62%; background: var(--heavy); animation: splat .72s ease-out forwards; }
    @keyframes splat { to { opacity: 0; transform: translate3d(var(--dx), var(--dy), 0) scale(.25); } }

    .wash-section {
      position: relative; min-height: 88vh; display: grid; place-items: center;
      overflow: hidden; padding-block: 12vh; isolation: isolate;
    }
    .wash-bg { position: absolute; inset: -15%; z-index: -1; width: 130%; height: 130%; }
    .quote { width: min(80vw, 860px); margin: 0; text-align: center; color: var(--heavy); }
    .quote p {
      margin: 0; font-size: clamp(2rem, 4.7vw, 5rem); font-weight: 700;
      line-height: 1.65; letter-spacing: .14em; opacity: .78;
      animation: ink-dry 5s ease-in-out infinite alternate;
    }
    .quote footer { margin-top: 2.4rem; color: var(--medium); font-size: .75rem; letter-spacing: .3em; }
    @keyframes ink-dry { to { opacity: 1; filter: contrast(1.05); } }

    .pause-section { position: relative; min-height: 105vh; overflow: hidden; }
    .pause-label { position: absolute; top: 13%; right: 14%; text-align: right; }
    .pause-mark { position: absolute; top: 57%; left: 24%; width: 88px; height: 70px; opacity: .58; }
    .pause-note { position: absolute; top: 65%; left: calc(24% + 110px); color: var(--light); font-size: .7rem; letter-spacing: .26em; }

    .cta-section { min-height: 70vh; display: grid; place-items: center; padding: 12vh var(--gutter); text-align: center; }
    .cta-wrap h2 { margin: 0 0 2.7rem; color: var(--dense); font-size: clamp(1.8rem, 4vw, 3.7rem); letter-spacing: .12em; }
    .seal-button {
      position: relative; display: inline-grid; min-width: 9.2rem; min-height: 4.2rem;
      padding: .9rem 1.8rem; place-items: center; overflow: hidden;
      color: var(--paper); background: var(--seal); font-weight: 700; letter-spacing: .22em;
      clip-path: polygon(3% 8%, 96% 1%, 100% 89%, 91% 100%, 4% 95%, 0 22%);
      filter: url(#seal-edge); transition: transform .5s var(--ease-ink);
    }
    .seal-button:hover { transform: translate3d(0, -4px, 0) rotate(-.6deg); }
    .seal-button::after {
      position: absolute; inset: 4px; content: ""; border: 1px solid rgba(247, 243, 236, .38);
      clip-path: polygon(1% 4%, 97% 1%, 100% 93%, 3% 98%);
    }

    .site-footer {
      display: flex; justify-content: space-between; align-items: flex-end;
      min-height: 24vh; padding: 3rem var(--gutter); color: var(--light);
      font-size: .68rem; letter-spacing: .2em;
    }
    .footer-mark { color: var(--heavy); font-size: 1.1rem; letter-spacing: .3em; }

    #ink-trail { position: fixed; inset: 0; z-index: 900; pointer-events: none; overflow: hidden; }
    .ink-dot {
      position: absolute; width: var(--size); height: var(--size); margin: calc(var(--size) / -2);
      border-radius: 43% 57% 64% 36%; background: var(--heavy); opacity: .24;
      filter: blur(var(--blur)); transform: rotate(var(--turn));
      animation: dot-fade 1s ease-out forwards; will-change: opacity, transform;
    }
    @keyframes dot-fade { to { opacity: 0; transform: scale(1.8) rotate(calc(var(--turn) + 28deg)); } }

    .reveal { opacity: 0; transform: translate3d(0, 24px, 0); transition: opacity 1s ease, transform 1.2s var(--ease-ink); }
    .reveal.visible { opacity: 1; transform: translate3d(0, 0, 0); }

    @media (max-width: 760px) {
      .site-nav { padding-top: 1.1rem; }
      .nav-links li:nth-child(2) { display: none; }
      .hero-copy { top: 18%; left: 10%; gap: 1rem; }
      .hero h1 { font-size: clamp(3rem, 16vw, 5rem); }
      .hero-kicker { margin-top: 2.5rem; }
      .hero-landscape { right: -30%; bottom: 0; width: 125vw; height: 67%; }
      .hero-caption { display: none; }
      .bold-section { min-height: auto; padding-bottom: 5rem; }
      .bold-heading { margin-left: 0; }
      .cards { display: grid; gap: 5rem; min-height: auto; margin-top: 4rem; }
      .ink-card { position: relative; inset: auto; width: 94%; }
      .card-two { margin-left: 6%; }
      .wash-section { min-height: 75vh; }
      .quote { width: 88vw; }
      .quote p { font-size: clamp(1.65rem, 8vw, 2.6rem); }
      .pause-label { top: 10%; right: 9%; }
      .pause-mark { left: 16%; }
      .pause-note { top: 68%; left: 16%; }
      .site-footer { min-height: 19vh; }
      #ink-trail { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .hero-landscape { opacity: 1; clip-path: none; transform: none; }
      .brush-path { stroke-dashoffset: 0; }
      .reveal { opacity: 1; transform: none; }
      #ink-trail { display: none; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">跳至正文</a>

  <svg width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <filter id="ink-wash" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency=".018 .055" numOctaves="4" seed="8" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="15" result="displaced"/>
        <feGaussianBlur in="displaced" stdDeviation="5.5"/>
      </filter>
      <filter id="ink-wash-soft" x="-25%" y="-25%" width="150%" height="150%">
        <feTurbulence type="fractalNoise" baseFrequency=".012 .04" numOctaves="3" seed="21" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="20" result="moved"/>
        <feGaussianBlur in="moved" stdDeviation="12"/>
      </filter>
      <filter id="brush-bleed" x="-10%" y="-100%" width="120%" height="300%">
        <feTurbulence type="fractalNoise" baseFrequency=".025 .2" numOctaves="3" seed="14" result="grain"/>
        <feDisplacementMap in="SourceGraphic" in2="grain" scale="5"/>
        <feGaussianBlur stdDeviation=".6"/>
      </filter>
      <filter id="card-edge" x="-8%" y="-8%" width="116%" height="116%">
        <feTurbulence type="fractalNoise" baseFrequency=".015 .04" numOctaves="3" seed="6" result="rough"/>
        <feDisplacementMap in="SourceGraphic" in2="rough" scale="4"/>
      </filter>
      <filter id="seal-edge" x="-12%" y="-12%" width="124%" height="124%">
        <feTurbulence type="fractalNoise" baseFrequency=".04" numOctaves="3" seed="31" result="rough"/>
        <feDisplacementMap in="SourceGraphic" in2="rough" scale="3"/>
      </filter>
    </defs>
  </svg>

  <header class="hero" id="top">
    <nav class="site-nav" aria-label="主导航">
      <a class="brand" href="#top">墨序</a>
      <ul class="nav-links">
        <li><a href="#bold">浓墨</a></li>
        <li><a href="#wash">渲染</a></li>
        <li><a href="#space">留白</a></li>
      </ul>
    </nav>

    <div class="hero-copy">
      <h1>墨随心生</h1>
      <p class="hero-kicker">一笔入境 · 万象无声</p>
    </div>

    <svg class="hero-landscape" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMax meet" aria-label="层叠于云雾中的水墨山景" role="img">
      <g filter="url(#ink-wash-soft)" opacity=".38" fill="#5c5555">

        <path d="M330 630 C450 518 500 458 580 394 C662 328 703 261 754 186 C809 301 867 383 960 455 C1052 527 1120 596 1200 630 L1200 760 L260 760 Z" opacity=".55"/>
      </g>

        <path d="M191 725 C248 665 309 613 353 515 C388 436 435 397 478 316 C513 389 549 427 607 481 C648 421 695 373 751 251 C803 381 853 472 940 529 C1017 580 1066 651 1182 700 L1200 760 L131 760 Z"/>
        <path d="M510 728 C586 650 630 587 681 524 C727 467 752 410 781 343 C821 447 877 515 947 565 C1015 614 1087 675 1200 711 L1200 760 L451 760 Z" opacity=".56"/>
      </g>
      <path d="M0 740 C116 682 180 625 251 580 C299 548 327 478 365 409 C410 502 457 555 533 596 C589 626 620 659 686 689 C790 736 893 699 995 718 C1060 729 1111 741 1200 749 L1200 760 L0 760 Z" fill="#121010" filter="url(#ink-wash)" opacity=".94"/>

        <path d="M184 670 C316 630 422 648 536 629 C662 608 778 643 895 619 C1004 597 1081 621 1200 609 L1200 692 C1080 713 971 687 855 711 C738 735 625 700 506 724 C384 749 286 718 157 740 Z" opacity=".58"/>

        <path d="M751 252 C770 319 790 362 822 405"/>
      </g>
    </svg>
    <span class="scroll-mark">向下</span>
    <span class="hero-caption">山无定形 · 墨有余韵</span>
  </header>

  <main id="main">
    <div class="divider" aria-hidden="true">
      <svg viewBox="0 0 1440 150" preserveAspectRatio="none"><path class="brush-path" stroke-width="11" d="M-40 97 C184 66 339 105 522 79 C716 51 891 87 1083 69 C1228 55 1344 71 1490 42"/></svg>
    </div>

    <section class="section bold-section" id="bold">
      <header class="bold-heading reveal">
        <p class="section-label">01 — Bold strokes</p>
        <h2 class="section-title">浓墨</h2>
      </header>
      <div class="cards">
        <article class="ink-card card-one reveal">
          <div class="card-art" aria-hidden="true">
            <svg viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice">
              <rect width="640" height="360" fill="#d4cfca"/>
              <g filter="url(#ink-wash-soft)" fill="#9e9595"><path d="M0 290 C86 214 143 185 211 98 C264 182 307 224 367 261 C424 212 459 137 518 79 C555 158 595 221 660 257 L660 380 L0 380Z"/></g>
              <g filter="url(#ink-wash)" fill="#2a2525" opacity=".8"><path d="M-20 337 C109 292 141 202 225 159 C267 235 329 292 408 305 C474 316 521 269 569 219 C595 263 622 295 670 319 L670 380 L-20 380Z"/></g>
              <path d="M474 202 Q480 169 481 121 M462 151 Q481 163 500 143" fill="none" stroke="#5c5555" stroke-width="3" opacity=".7"/>
            </svg>
          </div>
          <div class="card-copy"><span class="card-number">壹</span><div><h3>落笔有势</h3><p>以最少的形，留下最深的意。每一次显现，都像湿墨触纸，迅疾而有重量。</p></div></div>
        </article>

        <article class="ink-card card-two reveal">
          <div class="card-art" aria-hidden="true">
            <svg viewBox="0 0 640 360" preserveAspectRatio="xMidYMid slice">
              <rect width="640" height="360" fill="#f7f3ec"/>
              <g filter="url(#ink-wash-soft)" fill="#9e9595" opacity=".75"><path d="M-30 319 C94 247 190 266 267 178 C331 105 405 72 491 108 C552 134 595 196 681 223 L681 380 L-30 380Z"/></g>
              <g filter="url(#ink-wash)" fill="#121010" opacity=".73"><path d="M239 350 C278 284 309 226 338 134 C370 214 408 254 453 289 C493 320 543 326 610 345 L640 380 L209 380Z"/></g>
              <g fill="#5c5555" opacity=".65"><ellipse cx="109" cy="283" rx="5" ry="18"/><ellipse cx="124" cy="290" rx="3" ry="12"/><path d="M109 282 Q124 256 141 272" fill="none" stroke="#5c5555" stroke-width="2"/></g>
            </svg>
          </div>
          <div class="card-copy"><span class="card-number">贰</span><div><h3>随形而化</h3><p>不追求机械的齐整。边缘会呼吸，层次会游移，让秩序与偶然共同完成画面。</p></div></div>
        </article>
      </div>
    </section>

    <div class="divider" aria-hidden="true">
      <svg viewBox="0 0 1440 150" preserveAspectRatio="none"><path class="brush-path" stroke-width="8" d="M-50 52 C183 84 348 46 529 76 C710 105 868 63 1052 87 C1207 107 1348 68 1490 82"/></svg>
    </div>

    <section class="wash-section" id="wash">
      <svg class="wash-bg" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true">
        <g filter="url(#ink-wash-soft)">
          <path fill="#d4cfca" opacity=".78" d="M-80 242 C182 118 390 207 568 143 C790 64 1030 189 1520 83 L1520 742 C1265 681 1073 788 832 717 C568 640 343 791 -80 681Z"/>
          <path fill="#9e9595" opacity=".38" d="M-100 364 C140 242 361 377 605 268 C813 176 1008 355 1540 209 L1540 643 C1242 768 1050 581 812 681 C586 775 336 596 -100 779Z"/>
          <path fill="#5c5555" opacity=".16" d="M-90 506 C196 351 413 475 623 404 C853 326 1072 463 1530 338 L1530 584 C1209 677 1011 539 780 617 C539 698 296 549 -90 705Z"/>
        </g>
      </svg>
      <blockquote class="quote reveal">
        <p>计白当黑，知止而后有余韵。</p>
        <footer>— 在未落墨处，故事仍在继续</footer>
      </blockquote>
    </section>

    <div class="divider" aria-hidden="true">
      <svg viewBox="0 0 1440 150" preserveAspectRatio="none"><path class="brush-path" stroke-width="5" d="M-30 83 C156 65 319 96 484 75 C650 54 818 86 970 71 C1168 52 1304 89 1470 63"/></svg>
    </div>

    <section class="section pause-section" id="space">
      <header class="pause-label reveal">
        <p class="section-label">03 — The unspoken</p>
        <h2 class="section-title">留白</h2>
      </header>
      <svg class="pause-mark reveal" viewBox="0 0 100 80" aria-hidden="true">
        <path d="M2 68 C21 57 31 43 43 20 C52 38 59 46 72 53 C79 45 84 34 90 20 C93 38 97 50 104 59 L104 80 L0 80Z" fill="#5c5555" filter="url(#ink-wash)"/>
      </svg>
      <span class="pause-note reveal">静，亦是叙事。</span>
    </section>

    <section class="cta-section">
      <div class="cta-wrap reveal">
        <h2>让下一笔，由你落下</h2>
        <a class="seal-button" href="#top">入 境</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span class="footer-mark">墨序</span>
    <span>一纸 · 一境 · 一念</span>
  </footer>

  <div id="ink-trail" aria-hidden="true"></div>

  <script>
    (() => {
      const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const revealables = document.querySelectorAll('.reveal, .divider');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.16, rootMargin: '0px 0px -8% 0px' });
      revealables.forEach((el) => observer.observe(el));

      if (!reduceMotion && matchMedia('(pointer: fine)').matches) {
        const trail = document.querySelector('#ink-trail');
        let lastX = -100, lastY = -100, lastTime = 0;
        addEventListener('pointermove', (event) => {
          const now = performance.now();
          const distance = Math.hypot(event.clientX - lastX, event.clientY - lastY);
          if (distance < 12 || now - lastTime < 24) return;
          lastX = event.clientX; lastY = event.clientY; lastTime = now;
          const dot = document.createElement('i');
          const size = 4 + Math.random() * 10;
          dot.className = 'ink-dot';
          dot.style.left = event.clientX + 'px';
          dot.style.top = event.clientY + 'px';
          dot.style.setProperty('--size', size + 'px');
          dot.style.setProperty('--blur', (Math.random() * 1.4) + 'px');
          dot.style.setProperty('--turn', (Math.random() * 180) + 'deg');
          trail.appendChild(dot);
          dot.addEventListener('animationend', () => dot.remove(), { once: true });
        }, { passive: true });
      }

      if (!reduceMotion) {
        document.querySelectorAll('.ink-card').forEach((card) => {
          let ready = true;
          card.addEventListener('pointermove', (event) => {
            if (!ready || Math.random() > .12) return;
            ready = false;
            const rect = card.getBoundingClientRect();
            for (let i = 0; i < 5; i++) {
              const dot = document.createElement('i');
              const angle = Math.random() * Math.PI * 2;
              const distance = 18 + Math.random() * 42;
              dot.className = 'splatter';
              dot.style.left = (event.clientX - rect.left) + 'px';
              dot.style.top = (event.clientY - rect.top) + 'px';
              dot.style.setProperty('--s', (2 + Math.random() * 5) + 'px');
              dot.style.setProperty('--dx', Math.cos(angle) * distance + 'px');
              dot.style.setProperty('--dy', Math.sin(angle) * distance + 'px');
              card.appendChild(dot);
              dot.addEventListener('animationend', () => dot.remove(), { once: true });
            }
            setTimeout(() => { ready = true; }, 320);
          }, { passive: true });
        });
      }

      if (!reduceMotion && matchMedia('(pointer: coarse)').matches) {
        let lastScroll = 0;
        addEventListener('scroll', () => {
          const y = scrollY;
          if (Math.abs(y - lastScroll) < 90) return;
          lastScroll = y;
          const trail = document.querySelector('#ink-trail');
          trail.style.display = 'block';
          const dot = document.createElement('i');
          const edge = Math.random() > .5 ? 9 : innerWidth - 9;
          dot.className = 'ink-dot'; dot.style.left = edge + 'px';
          dot.style.top = (innerHeight * (.25 + Math.random() * .5)) + 'px';
          dot.style.setProperty('--size', (7 + Math.random() * 8) + 'px');
          dot.style.setProperty('--blur', '1px'); dot.style.setProperty('--turn', '0deg');
          trail.appendChild(dot);
          dot.addEventListener('animationend', () => dot.remove(), { once: true });
        }, { passive: true });
      }
    })();
  </script>
</body>
</html>
